name: Bursa Stock Alert

on:
  schedule:
    - cron: '15 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Bursa PHP Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: php bursa_alert.php

      - name: Save alert log if updated
        run: |
          if [ -f alerted_log.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add alerted_log.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update alert log" && git push)
          fi
